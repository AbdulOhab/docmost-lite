services:
  docmost:
    build: .
    depends_on:
      - db
    environment:
      APP_URL: 'http://localhost:3000'
      APP_SECRET: 'REPLACE_WITH_LONG_SECRET'
      DATABASE_URL: 'postgresql://docmost:STRONG_DB_PASSWORD@db:5432/docmost'
      # Creates the workspace and owner on first start (empty database only).
      # Remove these three lines to use the browser setup page instead.
      OWNER_EMAIL: 'you@example.com'
      OWNER_PASSWORD: 'CHANGE_ME_8_CHARS_MIN'
      OWNER_NAME: 'Owner'
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  docmost:
  db_data:
